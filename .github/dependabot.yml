version: 2

# This repo has no language-package dependencies for Dependabot to track
# (Monkey C / Connect IQ barrels are not a Dependabot ecosystem). The only
# updatable dependency is the set of GitHub Actions used by the workflows.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
