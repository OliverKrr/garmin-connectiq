<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" font-family="Helvetica, Arial, sans-serif">
  <rect width="280" height="280" fill="#1b1b1b"/>
  <circle cx="140" cy="140" r="139" fill="#ffffff"/>
  <text x="140" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">8:55</text>
  <!-- Pace triad: P / L / A, coloured by pace zone (dark palette for the white MIP theme) -->
  <g text-anchor="middle" fill="#006600">
    <text x="60" y="66" font-size="11">P 3.4</text><text x="140" y="66" font-size="11">L 3.2</text><text x="220" y="66" font-size="11">A 3.3</text>
    <text x="60" y="92" font-size="26" font-weight="bold">4:12</text><text x="140" y="92" font-size="26" font-weight="bold">4:20</text><text x="220" y="92" font-size="26" font-weight="bold">4:18</text>
  </g>
  <!-- HR triad, coloured by HR zone (zone 2 -> dark blue) -->
  <g text-anchor="middle" fill="#0000AA">
    <text x="60" y="120" font-size="11">HR 2.6</text><text x="140" y="120" font-size="11">LAP 2.4</text><text x="220" y="120" font-size="11">AVG 2.5</text>
    <text x="60" y="146" font-size="26" font-weight="bold">162</text><text x="140" y="146" font-size="26" font-weight="bold">158</text><text x="220" y="146" font-size="26" font-weight="bold">159</text>
  </g>
  <!-- Distance / cadence / duration -->
  <g text-anchor="middle" fill="#111111">
    <text x="60" y="174" font-size="11">DIST</text><text x="140" y="174" font-size="11">CAD</text><text x="220" y="174" font-size="11">TIME</text>
    <text x="60" y="199" font-size="24" font-weight="bold">8.42</text><text x="140" y="199" font-size="24" font-weight="bold">178</text><text x="220" y="199" font-size="24" font-weight="bold">44:10</text>
  </g>
  <!-- Time-in-zone bars: heights normalized to the busiest zone, each in its zone colour -->
  <g>
    <rect x="66" y="212" width="24" height="22" fill="#555555"/>
    <rect x="94" y="206" width="24" height="28" fill="#0000AA"/>
    <rect x="122" y="216" width="24" height="18" fill="#006600"/>
    <rect x="150" y="224" width="24" height="10" fill="#AA5500"/>
    <rect x="178" y="228" width="24" height="6" fill="#AA0000"/>
  </g>
</svg>
